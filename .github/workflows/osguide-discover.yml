name: OSGuide — Discover & Publish

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - publish

      runtime_minutes:
        description: "Maximum engine runtime"
        required: true
        default: "5"
        type: choice
        options:
          - "2"
          - "5"
          - "10"
          - "15"

      max_apps:
        description: "Maximum applications to process"
        required: true
        default: "5"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
          - "20"

concurrency:
  group: osguide-discovery-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: OSGuide Discovery Engine
    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      OSGUIDE_RUN_MODE: ${{ inputs.run_mode }}
      OSGUIDE_RUNTIME_MINUTES: ${{ inputs.runtime_minutes }}
      OSGUIDE_MAX_APPS: ${{ inputs.max_apps }}

    steps:
      - name: Checkout OSGuide
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: engine/requirements.txt

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s engine/requirements.txt ]; then
            pip install -r engine/requirements.txt
          fi

      - name: Show engine configuration
        run: |
          echo "======================================"
          echo " OSGuide Discovery Engine"
          echo "======================================"
          echo "Mode: $OSGUIDE_RUN_MODE"
          echo "Runtime: $OSGUIDE_RUNTIME_MINUTES minutes"
          echo "Maximum apps: $OSGUIDE_MAX_APPS"
          echo "======================================"

      - name: Run OSGuide Engine
        working-directory: engine
        run: python main.py
